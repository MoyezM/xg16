name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      matrix:
        # ubuntu runners have AVX2, so the x86 kernel is equivalence-tested
        # against the reference in CI; macos-latest is arm64, covering the
        # portable path on a non-x86 architecture.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --release
      - run: cargo run --release --example dedup_ratio

  bench-smoke:
    # Criterion's --test mode runs every benchmark once without collecting
    # statistics: it keeps the bench code compiling and executing. Real
    # numbers come from dedicated hardware, not shared CI runners.
    name: bench smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo bench -- --test
